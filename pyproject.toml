[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tdse1d"
version = "1.0.0"
description = "Crank-Nicolson solver for the 1D time-dependent Schrodinger equation (Python + Fortran)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nathan Feuerstein" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]
keywords = ["quantum mechanics", "Schrodinger equation", "Crank-Nicolson", "numerical methods", "TDSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Fortran",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["matplotlib>=3.7", "pytest>=7", "ruff==0.16.9"]

[project.urls]
Repository = "https://github.com/feuernath-design/Crank-Nicholson-Applied-numerical-methods-in-Numpy-for-quantum-mechanics-"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
ignore = ["RUF002", "RUF003"]  # allow unicode in comments/docstrings
