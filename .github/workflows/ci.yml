name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.16.9"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run tests (incl. Fortran/Python cross-validation)
        run: python -m pytest -v

  fortran-and-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Fortran debug build (bounds checks, FP traps, -Werror) and examples
        working-directory: fortran
        run: |
          make debug
          ./build/debug/cn_propagate examples/harmonic_wavepacket.nml
          ./build/debug/cn_propagate examples/soft_coulomb.nml
      - name: Install package
        run: python -m pip install -e ".[plots]"
      - name: Smoke-test every figure script
        run: make quick
